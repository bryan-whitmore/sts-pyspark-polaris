# spark.driver.extraClassPath/spark.executor.extraClassPath cannot be set
# programmatically from SparkSession.builder.config() in client/local mode
# — the driver JVM has already started by the time Python code runs, and
# Spark's docs explicitly call this out. This static file is read before
# JVM launch, which is why it works where the notebook-side .config() call
# didn't (confirmed live: "Cannot find catalog plugin class for catalog
# 'ndb'" until this file was added).
#
# Connector directory listed FIRST, deliberately: Spark ships its own
# ancient guava-14.0.1.jar (transitive Hadoop dependency), and the VAST
# connector needs guava-31.0.1-jre.jar (bundles Splitter.splitToStream,
# added in Guava 28+). Classpath resolution takes the first match it
# finds scanning left to right, so listing Spark's own jars/* first
# shadowed the connector's newer guava with the older one — confirmed
# live: "NoSuchMethodError: ...Splitter.splitToStream" until reordered.
spark.driver.extraClassPath=/usr/local/spark/jars/spark3-vast-3.5.1-e92442418427/*:/usr/local/spark/jars/*
spark.executor.extraClassPath=/usr/local/spark/jars/spark3-vast-3.5.1-e92442418427/*:/usr/local/spark/jars/*
