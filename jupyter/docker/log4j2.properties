# Based on Spark's own log4j2.properties.template, with the root level
# turned down from the default "info" to "warn" — the default was very
# noisy for this demo (per-request Spark/Hadoop/VAST-connector INFO logs
# on every notebook cell).
rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n%ex

# Settings to quiet third party logs that are too verbose
logger.jetty1.name = org.sparkproject.jetty
logger.jetty1.level = warn
logger.jetty2.name = org.sparkproject.jetty.util.component.AbstractLifeCycle
logger.jetty2.level = error
logger.repl1.name = org.apache.spark.repl.SparkIMain$exprTyper
logger.repl1.level = info
logger.repl2.name = org.apache.spark.repl.SparkILoop$SparkILoopInterpreter
logger.repl2.level = info
logger.thriftserver1.name = org.apache.spark.sql.hive.thriftserver.SparkJdbcListener
logger.thriftserver1.level = error

# The VAST connector installs a Spark parser extension and resolution rule
# that probe every relation Spark resolves -- including the Iceberg
# `demo.*` tables, which it cannot and need not resolve. Each probe logs a
# full ERROR stack trace ("could not find DataSource for provider: demo",
# "Failed to resolve UnresolvedRelation as a RCLS-enabled table") and then
# falls through correctly. Pure noise, and enough of it to make a working
# demo read as broken.
logger.ndbparser.name = ndb.NDBParser
logger.ndbparser.level = off
logger.ndbresolution.name = ndb.view.NDBTablesResolutionRule
logger.ndbresolution.level = off

# Likewise, the connector asks for row/column-level security metadata on
# every VASTDB table access. A cluster without RCLS configured answers that
# with a 500, which arrives here as a WARN plus a stack trace per query.
logger.ndbcatalogutils.name = spark.sql.catalog.ndb.VastCatalogUtils
logger.ndbcatalogutils.level = off

# com.vastdata.client.VastClient is deliberately left at the root level:
# it carries the genuine 403 that explains the VASTDB expected-fail cells.
# It also emits one-line 500s for the row-column-security probe above and
# 400s for LIST_SORTED_BY on a cluster without Elysium enabled -- both
# expected on this lab cluster, neither a failure.
