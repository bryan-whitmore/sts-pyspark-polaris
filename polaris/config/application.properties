# Mounted into the polaris and polaris-bootstrap containers via
# QUARKUS_CONFIG_LOCATIONS. Switches Polaris off its default in-memory
# store onto the Postgres container in ../postgres, using the
# relational-jdbc persistence backend (Apache Polaris 1.7.0).
#
# ${...} placeholders are resolved from the container's environment
# (POSTGRES_DB/USER/PASSWORD, POLARIS_REALM come from ../.env and
# ../.env.secrets via docker-compose env_file).

polaris.persistence.type=relational-jdbc

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
quarkus.datasource.username=${POSTGRES_USER}
quarkus.datasource.password=${POSTGRES_PASSWORD}

polaris.realm-context.realms=${POLARIS_REALM}

quarkus.otel.sdk.disabled=true
