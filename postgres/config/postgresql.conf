# Minimal overrides for the Polaris metadata Postgres instance.
# Based on the stock postgresql.conf shipped in postgres:17-bookworm;
# only the values below are changed from their defaults.

listen_addresses = '*'
max_connections = 100

shared_buffers = 128MB

log_timezone = 'UTC'
timezone = 'UTC'

lc_messages = 'C'
lc_monetary = 'C'
lc_numeric = 'C'
lc_time = 'C'

default_text_search_config = 'pg_catalog.english'
